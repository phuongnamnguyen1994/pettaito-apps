# Tự đóng gói app PetTaiTo / ClickOn cho Mac, Windows, Android mỗi khi có thay đổi (hoặc bấm "Run workflow").
# File cài được đăng ở mục Releases — link tải cố định:
#   https://github.com/<owner>/pettaito-apps/releases/latest/download/<tên file>
name: Build apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: 1.0.${{ github.run_number }}

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        variant: [pettaito, clickon]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cài công cụ
        working-directory: desktop
        run: npm install --no-fund --no-audit
      - name: Đóng gói ${{ matrix.variant }}
        working-directory: desktop
        run: node build.js ${{ matrix.variant }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}-${{ matrix.variant }}
          path: |
            desktop/dist/${{ matrix.variant }}/*.dmg
            desktop/dist/${{ matrix.variant }}/*.exe
          if-no-files-found: error

  android:
    strategy:
      fail-fast: false
      matrix:
        variant: [pettaito, clickon]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Khoá ký app (lấy từ Secrets)
        run: echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/keystore.p12"
      - name: Cài công cụ
        working-directory: android
        run: npm install --no-fund --no-audit
      - name: Đóng gói ${{ matrix.variant }}
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/keystore.p12
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: node build.mjs ${{ matrix.variant }}
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.variant }}
          path: android/dist/*.apk
          if-no-files-found: error

  release:
    needs: [desktop, android]
    if: always() && (needs.desktop.result == 'success' || needs.android.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Đăng bản mới
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          R="${{ github.repository }}"; T="v${APP_VERSION}"
          for i in 1 2 3 4 5; do
            gh release view "$T" --repo "$R" >/dev/null 2>&1 || gh release create "$T" --repo "$R" --title "PetTaiTo apps ${APP_VERSION}" --notes "Bản tự đóng gói từ commit ${{ github.sha }}" --latest && break
            sleep 10
          done
          for f in out/*; do
            for i in 1 2 3 4 5; do gh release upload "$T" "$f" --repo "$R" --clobber && break; sleep 15; done
          done
          gh release edit "$T" --repo "$R" --latest
