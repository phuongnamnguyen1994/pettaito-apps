# Tự đóng gói app PetTaiTo / ClickOn cho Mac, Windows, Android mỗi khi có thay đổi (hoặc bấm "Run workflow").
# File cài được đăng ở mục Releases — link tải cố định:
#   https://github.com/<owner>/pettaito-apps/releases/latest/download/<tên file>
name: Build apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: 1.0.${{ github.run_number }}

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        variant: [pettaito, clickon]
    runs-on: ${{ matrix.os }}
    env:
      MAC_P12: ${{ secrets.MAC_SIGN_P12_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Chữ ký cố định cho app Mac (lấy từ Secrets)
        if: runner.os == 'macOS' && env.MAC_P12 != ''
        run: |
          echo "$MAC_P12" | base64 -D > "$RUNNER_TEMP/sign.p12"
          KC="$RUNNER_TEMP/sign.keychain-db"
          security create-keychain -p ci "$KC"
          security set-keychain-settings "$KC"
          security unlock-keychain -p ci "$KC"
          security import "$RUNNER_TEMP/sign.p12" -k "$KC" -P pettaito -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          ID=$(security find-identity -p codesigning "$KC" | awk '/PetTaiTo Code Signing/{print $2; exit}')
          if [ -z "$ID" ]; then echo "Không tìm thấy chữ ký trong keychain"; security find-identity -p codesigning "$KC"; exit 1; fi
          echo "MAC_SIGN_ID=$ID" >> "$GITHUB_ENV"
          echo "MAC_SIGN_KEYCHAIN=$KC" >> "$GITHUB_ENV"
      - name: Cài công cụ
        working-directory: desktop
        run: npm install --no-fund --no-audit
      - name: Đóng gói ${{ matrix.variant }}
        working-directory: desktop
        run: node build.js ${{ matrix.variant }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}-${{ matrix.variant }}
          path: |
            desktop/dist/${{ matrix.variant }}/*.dmg
            desktop/dist/${{ matrix.variant }}/*.exe
          if-no-files-found: error

  android:
    strategy:
      fail-fast: false
      matrix:
        variant: [pettaito, clickon]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Khoá ký app (lấy từ Secrets)
        run: echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/keystore.p12"
      - name: Cài công cụ
        working-directory: android
        run: npm install --no-fund --no-audit
      - name: Đóng gói ${{ matrix.variant }}
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/keystore.p12
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: node build.mjs ${{ matrix.variant }}
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.variant }}
          path: android/dist/*.apk
          if-no-files-found: error

  release:
    needs: [desktop, android]
    if: needs.desktop.result == 'success' && needs.android.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Đăng bản mới
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          # chỉ đăng khi đủ cả 6 file (Mac chip M + Windows + Android cho 2 app) — thiếu là dừng, giữ nguyên bản cũ
          N=$(ls out | wc -l); echo "Số file: $N"; [ "$N" -eq 6 ] || { echo "Thiếu file, không đăng"; exit 1; }
          R="${{ github.repository }}"; T="v${APP_VERSION}"
          for i in 1 2 3 4 5; do
            gh release view "$T" --repo "$R" >/dev/null 2>&1 || gh release create "$T" --repo "$R" --title "PetTaiTo apps ${APP_VERSION}" --notes "Bản tự đóng gói từ commit ${{ github.sha }}" --latest && break
            sleep 10
          done
          for f in out/*; do
            for i in 1 2 3 4 5; do gh release upload "$T" "$f" --repo "$R" --clobber && break; sleep 15; done
          done
          gh release edit "$T" --repo "$R" --latest
